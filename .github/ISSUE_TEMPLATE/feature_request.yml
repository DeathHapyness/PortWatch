name: Sugerir uma melhoria
description: Proponha uma melhoria de escopo ou experiência de uso.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual necessidade concreta esta mudança resolveria?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva o comportamento desejado, sem presumir uma implementação específica.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options:
        - Backend/API
        - Collector
        - Frontend/dashboard
        - Netprobe
        - Docker/infraestrutura
        - Website/documentação
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Escopo
      options:
        - label: A proposta preserva o caráter somente-observação da v1.
          required: true
