name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-policy:
    name: Dev sandbox (static security policy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s infra/dev/tests -p "test_compose_security.py" -v

  netprobe:
    name: Netprobe (stdlib tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s infra/netprobe/tests -v

  smoke:
    name: Dev sandbox smoke test (compose + real backend + /health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs the real infra/dev/docker-compose.dev.yml stack (docker-socket-proxy
    # + netprobe + a throwaway fixture container) against the runner's own
    # Docker daemon — never the user's homelab (see CLAUDE.md: this IS "the
    # one dev sandbox", just executed on GitHub's ephemeral runner instead of
    # a laptop). The backend runs natively (uv run uvicorn), same as
    # README.md's local dev instructions, so this exercises the exact same
    # topology a contributor runs by hand: guard.sh -> compose up -> backend
    # -> real /health/ready against real docker-socket-proxy/netprobe.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.5"
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --locked --all-groups
      - name: Validate compose config
        run: docker compose -f infra/dev/docker-compose.dev.yml config >/dev/null
      - name: Bring up dev sandbox (through guard.sh, via make dev-up)
        run: make dev-up
      - name: Start backend natively against the sandbox
        working-directory: apps/backend
        env:
          PORTWATCH_DOCKER_PROXY_URL: http://127.0.0.1:2375
          PORTWATCH_NETPROBE_URL: http://127.0.0.1:8088
        run: |
          nohup uv run uvicorn portwatch_backend.app:app --host 127.0.0.1 --port 8000 \
            > /tmp/portwatch-backend.log 2>&1 &
          echo $! > /tmp/portwatch-backend.pid
      - name: Wait for /health/ready (real Collector cycle against the sandbox)
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          echo "backend never became ready within 30s" >&2
          cat /tmp/portwatch-backend.log >&2
          exit 1
      - name: Smoke test real endpoints
        run: |
          set -e
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -fsS http://127.0.0.1:8000/api/v1/system/summary
          echo
          curl -fsS http://127.0.0.1:8000/api/v1/containers | grep -q portwatch-dev-fixture-web
          curl -fsS http://127.0.0.1:8000/api/v1/ports
      - name: Teardown
        if: always()
        run: |
          kill "$(cat /tmp/portwatch-backend.pid)" 2>/dev/null || true
          make dev-down

  e2e:
    name: Backend E2E (real sandbox, apps/backend/tests/e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Complements `smoke` above: same real docker-socket-proxy/netprobe
    # stack, but exercised through the pytest suite (auth, containers,
    # networks, ports, host-only listeners via netprobe — see
    # apps/backend/tests/e2e/) instead of curl one-liners. The suite (via
    # its own conftest.py) manages guard -> compose up -> app lifespan ->
    # compose down itself — `make test-e2e` is the single entry point,
    # nothing else to orchestrate here.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.5"
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --locked --all-groups
      - run: make test-e2e

  prod-images:
    name: Production images (build + compose + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds the actual images an operator would run
    # (apps/backend/Dockerfile, apps/web/Dockerfile) and brings up the real
    # infra/prod/docker-compose.prod.yml — docker-socket-proxy + backend +
    # frontend, wired together exactly as documented in
    # infra/prod/README.md — against the runner's own Docker daemon. The
    # token/CORS values below are fixed CI-only placeholders, never used
    # outside this job.
    env:
      PORTWATCH_API_TOKEN: ci-smoke-test-token-not-a-real-secret
      PORTWATCH_CORS_ALLOW_ORIGINS: '["http://127.0.0.1:8080"]'
      COMPOSE_PROJECT_NAME: portwatch-prod-ci
    defaults:
      run:
        working-directory: infra/prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate compose config
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Build and start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for backend and frontend healthchecks
        run: |
          for _ in $(seq 1 30); do
            backend_status=$(docker inspect -f '{{.State.Health.Status}}' portwatch-prod-ci-backend-1 2>/dev/null || echo "")
            frontend_status=$(docker inspect -f '{{.State.Health.Status}}' portwatch-prod-ci-frontend-1 2>/dev/null || echo "")
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "backend/frontend never became healthy within 60s" >&2
          docker compose -f docker-compose.prod.yml logs
          exit 1
      - name: Smoke test through the frontend proxy
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          # No token: real 401 problem+json from the backend, proxied through.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/system/summary)" = "401" ]
          curl -fsS http://127.0.0.1:8080/api/v1/system/summary \
            -H "Authorization: Bearer ${PORTWATCH_API_TOKEN}" | grep -q portwatch_status
      - name: Backend does not leak a Server header (--no-server-header)
        # Checked against the backend container directly, not through the
        # frontend proxy — nginx sets its own Server header regardless of
        # what the backend sends, so going through 8080 would test nginx,
        # not the flag this step exists to catch a regression in.
        run: |
          docker exec portwatch-prod-ci-backend-1 python -c "
          import sys, urllib.request
          headers = urllib.request.urlopen('http://127.0.0.1:8000/health').headers
          sys.exit('Server' in headers)
          "
      - name: Only the frontend publishes a host port
        run: |
          set -e
          [ -z "$(docker port portwatch-prod-ci-docker-socket-proxy-1 2>/dev/null)" ]
          [ -z "$(docker port portwatch-prod-ci-backend-1 2>/dev/null)" ]
          docker port portwatch-prod-ci-frontend-1 | grep -q '127.0.0.1:8080'
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml down --rmi local

  prod-images-zero-config:
    name: Production images (zero-config quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Companion to `prod-images` above, with no PORTWATCH_API_TOKEN or
    # PORTWATCH_CORS_ALLOW_ORIGINS set at all — the actual "clone and
    # `docker compose up`, nothing to configure first" path documented in
    # infra/prod/README.md. Regression guard for
    # apps/backend/docker-entrypoint.sh's auto-generated token specifically
    # (the `prod-images` job above always provides an explicit token, so it
    # would never catch that path breaking).
    env:
      COMPOSE_PROJECT_NAME: portwatch-prod-ci-zeroconf
    defaults:
      run:
        working-directory: infra/prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and start the production stack with no env vars set
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for backend and frontend healthchecks
        run: |
          for _ in $(seq 1 30); do
            backend_status=$(docker inspect -f '{{.State.Health.Status}}' portwatch-prod-ci-zeroconf-backend-1 2>/dev/null || echo "")
            frontend_status=$(docker inspect -f '{{.State.Health.Status}}' portwatch-prod-ci-zeroconf-frontend-1 2>/dev/null || echo "")
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "backend/frontend never became healthy within 60s" >&2
          docker compose -f docker-compose.prod.yml logs
          exit 1
      - name: Extract the auto-generated token from the container logs and use it
        run: |
          set -e
          token=$(docker logs portwatch-prod-ci-zeroconf-backend-1 2>&1 | sed -n 's/.*PORTWATCH_API_TOKEN=\([0-9a-f]\{64\}\).*/\1/p' | head -1)
          if [ -z "$token" ]; then
            echo "no auto-generated token found in backend logs" >&2
            docker logs portwatch-prod-ci-zeroconf-backend-1 >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/api/v1/system/summary \
            -H "Authorization: Bearer ${token}" | grep -q portwatch_status
      - name: Default CORS origin (127.0.0.1:8080) is accepted with no override
        run: |
          set -e
          origin=$(curl -s -o /dev/null -D - -X OPTIONS http://127.0.0.1:8080/api/v1/system/summary \
            -H "Origin: http://127.0.0.1:8080" \
            -H "Access-Control-Request-Method: GET" | grep -i '^access-control-allow-origin:')
          echo "$origin" | grep -q 'http://127.0.0.1:8080'
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml down --rmi local

  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.5"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  frontend:
    name: Frontend (lint, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
