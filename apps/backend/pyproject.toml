[project]
name = "portwatch-backend"
version = "0.1.0"
description = "PortWatch backend: FastAPI API + Docker/host collector, single process."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2,<8",
    "fastapi>=0.140",
    "httpx>=0.27",
    "prometheus-client>=0.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "types-docker>=7.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# e2e tests start real Docker containers (infra/dev/docker-compose.dev.yml)
# and are opt-in — excluded here so a plain `uv run pytest` never touches
# Docker; run them explicitly with `make test-e2e` or `uv run pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: exercises the real dev sandbox (Docker required) — see tests/e2e/conftest.py",
]
