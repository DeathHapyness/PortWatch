# Sandbox de desenvolvimento do PortWatch.
#
# Isolado do Docker de produção do homelab por construção: usa sempre o
# contexto Docker "default" desta máquina de desenvolvimento (ver guard.sh).
#
# Serviços:
#   - fixture-web: alvo inerte para validar o ciclo de vida do sandbox
#     (up/down limpo) desde a Fase 1. Não é parte do PortWatch.
#   - docker-socket-proxy: isolamento usado pelo Collector (ver
#     docs/adr/0003-docker-access-isolation.md). ÚNICO container com o
#     socket Docker real montado, e só em modo leitura (GET-only via
#     allowlist HAProxy da própria imagem — POST=0 é o interruptor mestre).
#     Nenhum outro serviço deste compose monta o socket.
#   - netprobe: descoberta de portas usada pelo Collector. ÚNICO serviço com
#     `network_mode: host` (necessário para enxergar as portas ocupadas na
#     netns do host via /proc/net/*) e, em contrapartida, SEM nenhum acesso
#     ao socket Docker. Ver infra/netprobe/README.md para o contrato HTTP.
#
# O backend, durante desenvolvimento, roda nativamente no host (`uv run
# uvicorn`, fora de qualquer rede Docker) — por isso docker-socket-proxy e
# netprobe também publicam em 127.0.0.1 (loopback do host), além de
# docker-socket-proxy estar na rede portwatch-dev-net para uso futuro por
# outros containers.

services:
  fixture-web:
    image: nginx:alpine
    container_name: portwatch-dev-fixture-web
    labels:
      - "portwatch.env=dev-sandbox"
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - portwatch-dev-net

  # docker-socket-proxy: proxy HAProxy (Tecnativa) na frente do socket Docker
  # real deste host de dev. Pinado por tag+digest (não ":latest" — ver
  # docs/audits/2026-08-23-auditoria-tecnica.md, achado PW-12, sobre imagens
  # mutáveis no sandbox). Allowlist é GET-only: somente CONTAINERS/NETWORKS/
  # VERSION habilitados; POST=0 desabilita qualquer escrita em
  # qualquer seção (mesmo que uma delas seja habilitada por engano no
  # futuro). As demais seções (AUTH, SECRETS, EXEC, IMAGES, ...) já vêm
  # revogadas por padrão na imagem, mas são listadas abaixo explicitamente
  # para não depender silenciosamente do default upstream.
  docker-socket-proxy:
    image: "tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459"
    container_name: portwatch-dev-docker-socket-proxy
    labels:
      - "portwatch.env=dev-sandbox"
    environment:
      # Habilitado — o mínimo que o backend precisa para containers, redes,
      # inspect/list de containers e redes, e version (ver
      # apps/backend/src/portwatch_backend/core/config.py).
      CONTAINERS: "1"
      NETWORKS: "1"
      VERSION: "1"
      # Interruptor mestre: com POST=0, a imagem só permite GET/HEAD em
      # QUALQUER seção, independente do que estiver habilitado acima.
      POST: "0"
      # Explicitamente revogado (já é o default da imagem — repetido aqui
      # para o allowlist ficar auditável só de olhar este arquivo).
      AUTH: "0"
      SECRETS: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      EVENTS: "0"
      PING: "0"
      BUILD: "0"
      COMMIT: "0"
      VOLUMES: "0"
      SYSTEM: "0"
      TASKS: "0"
      SERVICES: "0"
      SWARM: "0"
      NODES: "0"
      PLUGINS: "0"
      SESSION: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      GRPC: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_UNPAUSE: "0"
    volumes:
      # Socket real deste host de dev, só leitura. Único mount desse tipo em
      # todo o sandbox — nenhum outro serviço monta o socket Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Loopback apenas — backend nativo (uv run uvicorn) alcança via
      # http://127.0.0.1:2375. Nunca 0.0.0.0 (ver README da imagem: nunca
      # expor esse container a uma rede que não seja a dos consumidores
      # confiáveis).
      - "127.0.0.1:2375:2375"
    networks:
      - portwatch-dev-net
    read_only: true
    # A imagem (HAProxy) renderiza sua config final em /tmp/haproxy.cfg no
    # entrypoint e grava pid/estado em /run e /var/lib/haproxy — únicos
    # diretórios graváveis necessários com o rootfs read-only.
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    # Nota: a imagem termina seu Dockerfile com `USER root` (precisa
    # escrever a config renderizada e ler o socket montado) — não suporta
    # non-root upstream. Não sobrescrevemos `user:` aqui; o restante do
    # hardening (read_only, cap_drop, no-new-privileges, GET-only) permanece.

  # netprobe: utilitário mínimo próprio (infra/netprobe/), função única.
  # Único serviço com network_mode: host (necessário para ver as portas
  # ocupadas na netns do host) e, por isso, sem NENHUM acesso ao socket
  # Docker. Ver infra/netprobe/README.md para o contrato HTTP completo e a
  # justificativa de cada capability (ou falta dela).
  netprobe:
    build:
      context: ../netprobe
    image: portwatch-dev/netprobe:local
    container_name: portwatch-dev-netprobe
    labels:
      - "portwatch.env=dev-sandbox"
    network_mode: host
    environment:
      # Loopback apenas — com network_mode: host, `ports:` do Compose não
      # se aplica; é o próprio processo que precisa se vincular a 127.0.0.1
      # para não ficar acessível pela LAN.
      NETPROBE_HOST: "127.0.0.1"
      NETPROBE_PORT: "8088"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5

networks:
  portwatch-dev-net:
    name: portwatch-dev-net
    labels:
      - "portwatch.env=dev-sandbox"
